# Memory-lean settings: up to 3 agents build in parallel worktrees next to the emulator
# on a 16 GB machine (see MEMORY.md). Kotlin compiles inside the Gradle daemon (no 2nd JVM).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
