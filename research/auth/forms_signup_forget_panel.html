<!-- Extracted <form> blocks (guest view), fetched 2026-10-11 with an iPhone Safari UA. -->
<!-- ===== signup ===== -->
<form action="#" class="form" method="post" data-form="register">
                <div class="alert"></div>
                <div class="input">
                    <i class="fa-thin fa-user"></i>
                    <input type="text" name="username" id="username" placeholder="نام کاربری" required />
                    <span id="username-status" class="status-message"></span>
                </div>
                <div class="input">
                    <i class="fa-thin fa-key"></i>
                    <input type="text" name="email" id="email" placeholder="ایمیل" required />
                    <span id="email-status" class="status-message"></span>
                </div>
                <div class="input">
                    <i class="fa-thin fa-key"></i>
                    <input type="password" name="password1" id="password1" placeholder="رمز عبور" required />
                </div>
                <div class="input">
                    <i class="fa-thin fa-key"></i>
                    <input type="password" name="password2" id="password2" placeholder="تکرار رمز عبور" required />
                    <span id="password-status" class="status-message"></span>
                </div>

                <div class="operations">
                    <button type="submit">ثبت نام</button>
                </div>
                <div class="back-site">
                    <a href="https://euploadi.com">
                        <div class="icon"><i class="fa-light fa-angle-right"></i></div>
                        <span>بازگشت به صفحه اصلی</span>
                    </a>
                </div>
            </form>
<!-- ===== forget ===== -->
<form action="#" class="form" method="post" data-form="forget">
                <div class="alert"></div>
                <div class="input">
                    <i class="fa-thin fa-key"></i>
                    <input type="text" name="email" placeholder="ایمیل" />
                </div>
                <div class="operations">
                    <button type="submit">بازیابی</button>
                </div>
                <div class="back-site">
                    <a href="https://euploadi.com">
                        <div class="icon"><i class="fa-light fa-angle-right"></i></div>
                        <span>بازگشت به صفحه اصلی</span>
                    </a>
                </div>
            </form>
<!-- ===== panel ===== -->
<form action="#" class="form" method="post" data-form="login">
                <div class="alert"></div>
                <div class="input">
                    <i class="fa-thin fa-user"></i>
                    <input type="text" name="username" placeholder="نام کاربری یا ایمیل" />
                </div>
                <div class="input">
                    <i class="fa-thin fa-key"></i>
                    <input type="password" name="password" placeholder="رمز عبور" />
                </div>
                <div class="operations">
                    <a href="https://euploadi.com/forget-password" class="forget">رمز عبور را فراموش کرده اید؟</a>
                    <button type="submit">ورود به حساب کاربری</button>
                </div>
                <div class="back-site">
                    <a href="https://euploadi.com">
                        <div class="icon"><i class="fa-light fa-angle-right"></i></div>
                        <span>بازگشت به صفحه اصلی</span>
                    </a>
                </div>
            </form>
