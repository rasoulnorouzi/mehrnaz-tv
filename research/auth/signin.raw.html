                    .css( {left: "0"} );
                alert_box

document.addEventListener("DOMContentLoaded", function () {
    const replacements = {
        "MegaByte": "مگابایت",
        "GigaByte": "گیگابایت",
        "Season": "فصل",
        "Episode": "قسمت",
        "نماوا": "اختصاصی",

        "انتخاب درگاه": "قبل از ورود به درگاه لطفا حتما فیلترشکن خود را خاموش کنید!",
        "گپ فیلم": "اختصاصی استودیو 1",
        "گپفیلم": "اختصاصی",
        "تراکنش لغو شده است کد خطا : 101": "پرداخت با موفقیت انجام شد، فعال سازی تا حداکثر 10 دقیقه",
        "فیلیمو": "اختصاصی"
    };

    // ساخت یک Regex یکپارچه برای سرعت بسیار بالاتر
    const pattern = new RegExp(Object.keys(replacements).join("|"), "g");

    function scan(element) {
        if (!element) return;
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
                // نادیده گرفتن کدهای برنامه نویسی و استایل ها
                if (node.parentNode && ['SCRIPT', 'STYLE', 'NOSCRIPT'].includes(node.parentNode.nodeName)) {
                    return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
            }
        }, false);

        let node;
        while (node = walker.nextNode()) {
            if (pattern.test(node.nodeValue)) {
                node.nodeValue = node.nodeValue.replace(pattern, match => replacements[match]);
            }
        }
    }

    // اسکن اولیه
    scan(document.body);

    // استفاده از تایمر برای جلوگیری از لگ زدن هنگام تغییرات سریع DOM
    let timeout;
    const observer = new MutationObserver(mutations => {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            mutations.forEach(m => {
                m.addedNodes.forEach(node => {
                    if (node.nodeType === 1) {
                        scan(node);
                    } else if (node.nodeType === 3) {
                        if (pattern.test(node.nodeValue)) {
                            node.nodeValue = node.nodeValue.replace(pattern, match => replacements[match]);
                        }
                    }
                });
            });
        }, 50); // ۵۰ میلی ثانیه تاخیر برای تجمیع تغییرات و جلوگیری از هنگ کردن
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
});
</script>

                    if (button) {

                            e.preventDefault();
                            fetch(fileUrl)
                            .then(response => {
                                if (!response.ok) throw new Error("File not found: " + response.status);
                                return response.text();
                            })
                            .then(text => {
                                var links = text.trim().split('\n');
                                var randomLink = links[Math.floor(Math.random() * links.length)].trim();
                                if (!randomLink) {
                                    return;
                                }
                                var finalUrl = baseUrl + randomLink;
                                localStorage.setItem('randomMoviePlayed', 'true');
                                window.location.href = finalUrl;
                            })
                            .catch(err => {});
                        });
                    }
                }
                redirectToRandomLink(startButton, '/emkanat/watch-random.txt');
